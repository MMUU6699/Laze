events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for mobile clients (30 requests/second per IP with burst of 50)
    limit_req_zone $binary_remote_addr zone=laze_api:10m rate=30r/s;

    # Upstream backends
    upstream osrm_backend {
        server osrm-iraq:5000;
        keepalive 32;
    }

    upstream photon_backend {
        server photon:2322;
        keepalive 16;
    }

    upstream tiles_backend {
        server tileserver:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","region":"iraq","services":["osrm","photon","tiles"]}';
            add_header Content-Type application/json;
        }

        # OSRM Directions Routing API
        location /route/v1/ {
            limit_req zone=laze_api burst=50 nodelay;
            proxy_pass http://osrm_backend/route/v1/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        }

        # Photon Arabic Geocoding & Search API
        location /api {
            limit_req zone=laze_api burst=30 nodelay;
            proxy_pass http://photon_backend/api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header Access-Control-Allow-Origin * always;
        }

        # Vector Tiles API (MapLibre PMTiles)
        location /tiles/ {
            limit_req zone=laze_api burst=100 nodelay;
            proxy_pass http://tiles_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Cache vector tiles
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
